name: Deploy

# Todo push na main (mensagem "att" serve) constrói as imagens, publica no GHCR e atualiza o servidor pela rede Tailscale.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da imagem para (re)implantar. Vazio = último commit. Use para voltar a uma versão anterior.'
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  testes:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  imagens:
    name: Construir e publicar imagens
    needs: testes
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.nome.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: nome
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.nome.outputs.prefix }}-backend:${{ github.sha }}
            ${{ steps.nome.outputs.prefix }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.nome.outputs.prefix }}-frontend:${{ github.sha }}
            ${{ steps.nome.outputs.prefix }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  implantar:
    name: Atualizar o servidor
    needs: imagens
    if: ${{ always() && (needs.imagens.result == 'success' || (inputs.tag != '' && needs.imagens.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Entrar na rede Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Localizar servidor na tailnet
        id: target
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SERVER_IP="$(tailscale status --json | jq -r --arg host "$SERVER_HOST" '
            [
              .Peer[]?
              | select(
                  ((.HostName // "") | ascii_downcase) == ($host | ascii_downcase)
                  or ((.DNSName // "" | ascii_downcase | sub("\\.$"; "")) == ($host | ascii_downcase | sub("\\.$"; "")))
                  or ((.TailscaleIPs // []) | index($host))
                )
              | .TailscaleIPs[0] // empty
            ]
            | unique
            | if length == 1 then .[0] else empty end
          )"
          if [ -z "$SERVER_IP" ]; then
            echo "::error::DEPLOY_HOST não corresponde a um dispositivo único na tailnet. Use o IP Tailscale (100.x.y.z) ou o hostname MagicDNS do servidor."
            exit 1
          fi
          echo "Servidor localizado na tailnet; usando o endereço Tailscale para SSH."
          echo "host=$SERVER_IP" >> "$GITHUB_OUTPUT"
          echo "Testando conectividade Tailscale..."
          if ! timeout 15s tailscale ping "$SERVER_IP"; then
            echo "::error::O servidor não respondeu pela Tailscale. Verifique se está online e autorizado na tailnet."
            exit 1
          fi
      - name: Atualizar via Tailscale SSH
        env:
          SERVER: ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }}
          TAG: ${{ inputs.tag || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # o token do GitHub (curto, só leitura de pacotes neste job) vai pelo stdin, nunca pela linha de comando
          printf '%s' "$GHCR_TOKEN" | ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new "$SERVER" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null && cd /opt/dashboard && sed -i 's/^TAG=.*/TAG=$TAG/' .env && PROFILE='' && if grep -qx 'ASSISTANT_ENABLED=true' .env; then PROFILE='--profile assistant'; fi && docker compose \$PROFILE pull && docker compose \$PROFILE up -d --remove-orphans && if [ \"\$PROFILE\" = '--profile assistant' ]; then MODEL=\$(sed -n 's/^OLLAMA_MODEL=//p' .env | head -1); docker compose --profile assistant exec -T ollama ollama pull \"\${MODEL:-qwen2.5:1.5b}\"; fi && docker image prune -f >/dev/null && docker logout ghcr.io >/dev/null"
      - name: Verificar saúde
        env:
          SERVER: ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }}
        run: |
          for i in $(seq 1 30); do
            if ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "$SERVER" "cd /opt/dashboard && docker compose exec -T backend wget -qO- http://127.0.0.1:3000/health" | grep -q '"ok":true'; then echo "API respondendo"; exit 0; fi
            sleep 5
          done
          echo "::error::A API não respondeu em 2,5 minutos. Para voltar: rode este workflow manualmente (Run workflow) com a tag do commit anterior."; exit 1
