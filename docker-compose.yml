# Sistema completo: Postgres + API + painel (nginx) + backup diário.
# As imagens vêm do GitHub Container Registry (construídas pelo GitHub Actions).
name: dashboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX no .env}-backend:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # ausente em CI (nunca commitado); obrigatório de fato no servidor via .env.example
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DASH_USER: ${DASH_USER:-admin}
      DASH_PASSWORD: ${DASH_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:80"   # só a própria máquina; o Tailscale publica daqui
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: dashboard
      PGDATABASE: dashboard
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump | gzip > /backups/dashboard-$$(date +%F).sql.gz
          find /backups -name 'dashboard-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

  # --- Alertas por WhatsApp (opcional) ---
  # Só sobe com: docker compose --profile whatsapp up -d (o setup.sh faz isso sozinho se WHATSAPP_ENABLED=true no .env).
  # Gateway não-oficial (conecta via QR code ao WhatsApp de verdade) — serve bem pra alertas internos de baixo volume;
  # não é o canal oficial da Meta, então não use para mensagens em massa ou marketing.
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      SERVER_URL: http://127.0.0.1:8081
      AUTHENTICATION_TYPE: apikey
      # Sem ":?erro" de propósito: essas vars só existem de fato quando WHATSAPP_ENABLED=true no .env.
      # Um ":?erro" aqui quebraria o "docker compose config"/"up" de QUALQUER instalação (mesmo sem
      # o perfil whatsapp ativo), porque o Compose interpola todos os serviços antes de filtrar por profile.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-me}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-troque-me}@evolution-db:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "127.0.0.1:8081:8080"   # só a própria máquina — é aqui que você escaneia o QR code (ver README)
    depends_on:
      evolution-db:
        condition: service_healthy

  evolution-db:
    image: postgres:16-alpine
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-troque-me}
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20

  evolution-redis:
    image: redis:alpine
    profiles: ["whatsapp"]
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  pgdata:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:
