# Sistema completo: Postgres + API + painel (nginx) + backup diário.
# As imagens vêm do GitHub Container Registry (construídas pelo GitHub Actions).
name: dashboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX no .env}-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DASH_USER: ${DASH_USER:-admin}
      DASH_PASSWORD: ${DASH_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:80"   # só a própria máquina; o Tailscale publica daqui
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: dashboard
      PGDATABASE: dashboard
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump | gzip > /backups/dashboard-$$(date +%F).sql.gz
          find /backups -name 'dashboard-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
